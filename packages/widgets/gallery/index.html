<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>VestLens widget gallery (dev only, synthetic data)</title>
  <style>
    :root { color-scheme: light; --page: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e8ecf0; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #0f1412; --ink: #eef3f1; --muted: #93a39c; --line: #25302b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 16px; }
    header p { margin: 0; color: var(--muted); font-size: 12px; }
    nav { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a[aria-current="true"] { color: var(--ink); text-decoration: underline; }
    main { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px 24px; padding: 24px; }
    figure { margin: 0; width: 420px; }
    figcaption { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    iframe { display: block; width: 420px; height: 160px; border: 1px solid var(--line); border-radius: 12px; background: transparent; }
  </style>
</head>
<body>
  <header>
    <h1>VestLens widget gallery</h1>
    <p>Dev only. Every figure is synthetic. Widgets load from ../dist (run the widgets build first).</p>
    <nav id="nav" aria-label="Gallery controls"></nav>
  </header>
  <main id="grid"></main>
  <script src="./host.js"></script>
</body>
</html>
