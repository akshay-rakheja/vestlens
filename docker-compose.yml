# VestLens, self-hosted: PostgreSQL, a one-shot migration, and the app.
# Start it with `docker compose up -d` after `npm run setup` has written .env (see README.md).
# Run one instance only. Nothing here talks to anything but your own database and SnapTrade.
name: vestlens

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Must match DATABASE_URL in .env. The database is not published to the host.
      POSTGRES_USER: vestlens
      POSTGRES_PASSWORD: vestlens
      POSTGRES_DB: vestlens
    volumes:
      - vestlens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestlens -d vestlens"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrator
    env_file: ${VESTLENS_ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: production
    env_file: ${VESTLENS_ENV_FILE:-.env}
    # Loopback only. See README.md before exposing it to your network.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  vestlens-db:
